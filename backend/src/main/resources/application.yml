spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/f1ticketdb}
    username: ${SPRING_DATASOURCE_USERNAME:f1user}
    password: ${SPRING_DATASOURCE_PASSWORD:f1password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
