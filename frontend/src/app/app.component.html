<div class="min-h-screen bg-f1-dark text-white font-sans flex flex-col">
  <!-- Header -->
  <header class="bg-f1-red py-6 shadow-lg border-b-4 border-white">
    <div class="container mx-auto px-4 flex justify-between items-center">
      <h1 class="text-3xl font-black italic tracking-wider">F1 ISTANBUL<span class="text-black ml-2">2026</span></h1>
      <span class="font-bold text-sm bg-black px-3 py-1 rounded">RESMİ BİLET PLATFORMU</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow container mx-auto px-4 py-12">
    <div class="flex flex-col lg:flex-row gap-12 justify-center">
      
      <!-- Left: Form -->
      <div class="w-full lg:w-1/2 bg-gray-900 p-8 rounded-xl shadow-2xl border border-gray-800" *ngIf="!pdfUrl">
        <h2 class="text-2xl font-bold mb-2">Biletini Ayırt</h2>
        <p class="text-gray-400 mb-8 text-sm">Dünyanın en heyecanlı pistinde yerini almak için hemen bilgilerini gir.</p>
        
        <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div class="flex gap-4">
            <div class="w-1/2">
              <label class="block text-sm font-bold text-gray-300 mb-1">Ad</label>
              <input type="text" formControlName="firstName" class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-f1-red focus:ring-1 focus:ring-f1-red transition">
            </div>
            <div class="w-1/2">
              <label class="block text-sm font-bold text-gray-300 mb-1">Soyad</label>
              <input type="text" formControlName="lastName" class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-f1-red focus:ring-1 focus:ring-f1-red transition">
            </div>
          </div>
          
          <div>
            <label class="block text-sm font-bold text-gray-300 mb-1">E-posta</label>
            <input type="email" formControlName="email" class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-f1-red focus:ring-1 focus:ring-f1-red transition">
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-300 mb-2">Tribün Seçimi & Pist Haritası</label>
            <div class="flex flex-col gap-4">
              <select formControlName="grandstand" class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-f1-red focus:ring-1 focus:ring-f1-red transition appearance-none">
                <option value="" disabled selected>Bir tribün seçin...</option>
                <option *ngFor="let g of grandstands" [value]="g">{{ g }}</option>
              </select>
              
              <!-- İstanbul Park Haritası -->
              <div class="w-full bg-gray-200 rounded-lg p-2 border-2 border-gray-700 flex flex-col items-center shadow-inner relative">
                <img src="https://media.formula1.com/image/upload/f_auto/q_auto/v1677244985/content/dam/fom-website/2018-redesign-assets/Track%20icons%204x3/Turkey.png" alt="İstanbul Park Pist Haritası" class="w-full max-h-48 object-contain filter drop-shadow-md">
                
                <!-- Özel Harita İşaretçileri (Rozetler) -->
                <!-- Viraj 8 pistin sol alt kısımlarına denk gelir -->
                <div class="absolute top-[65%] left-[25%] bg-f1-red text-white text-[10px] font-bold px-2 py-0.5 rounded border border-white shadow-lg transform -translate-x-1/2 -translate-y-1/2 animate-bounce">Viraj 8</div>
                <!-- Ana Tribün düzlüğü alt ortada yer alır -->
                <div class="absolute bottom-[20%] left-[48%] bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded border border-white shadow-lg transform -translate-x-1/2 -translate-y-1/2">Ana Tribün</div>
                <!-- Açık alan genellikle 12-14. virajlar civarı (sağ üst) -->
                <div class="absolute top-[20%] right-[18%] bg-green-600 text-white text-[10px] font-bold px-2 py-0.5 rounded border border-white shadow-lg transform -translate-x-1/2 -translate-y-1/2">Açık Alan</div>
              </div>
            </div>
          </div>

          <div class="pt-4">
            <button type="submit" [disabled]="isLoading" class="w-full bg-f1-red hover:bg-red-700 text-white font-bold py-4 rounded-lg text-lg uppercase tracking-wider transition-colors disabled:opacity-50 flex justify-center items-center shadow-lg">
              <span *ngIf="!isLoading">Ödemeyi Tamamla (Simülasyon)</span>
              <span *ngIf="isLoading" class="animate-pulse">İşleniyor...</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Right/After Submit: PDF Preview -->
      <div class="w-full lg:w-3/4 flex flex-col items-center animate-fade-in" *ngIf="pdfUrl">
        <div class="bg-green-600 text-white px-6 py-3 rounded-lg mb-6 font-bold w-full text-center shadow-lg text-xl">
          🎉 Biletin Başarıyla Oluşturuldu! 
        </div>
        
        <div class="w-full h-[600px] bg-gray-800 rounded-xl overflow-hidden shadow-2xl border-4 border-gray-700 mb-6 relative">
          <!-- PDF iFrame -->
          <iframe [src]="pdfUrl" class="w-full h-full border-none" title="F1 Bilet"></iframe>
        </div>
        
        <button (click)="downloadPdf()" class="bg-white text-black hover:bg-gray-200 font-bold py-3 px-12 rounded-lg text-lg uppercase tracking-wider transition shadow-lg flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          Biletimi İndir
        </button>
      </div>
    </div>
  </main>

  <!-- Gizli Ses Dosyası (Safari Uyumluluğu İçin) -->
  <audio id="engineSound" src="https://www.soundjay.com/transportation/sounds/race-car-1.mp3" preload="auto"></audio>
</div>
